name: CI

# Runs on GitHub Actions for github.com/inkstaveapp/inkstave (scaffolded in M0,
# first executed once the repository was published).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kotlin:
    name: Kotlin (client/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      # The desktop integration tests start the real processing service, which
      # ProcessingServiceLauncher looks for at processing-service/.venv.
      - name: Set up processing-service/.venv
        working-directory: processing-service
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../format/python
          .venv/bin/pip install -e .
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: ktlintCheck
        working-directory: client
        run: ./gradlew ktlintCheck --console=plain
      - name: Unit + desktop tests
        working-directory: client
        run: ./gradlew :shared:test :shared:desktopTest --console=plain
      - name: Build desktop app
        working-directory: client
        run: ./gradlew :desktopApp:build --console=plain
      - name: Build Android debug APK
        working-directory: client
        run: ./gradlew :androidApp:assembleDebug --console=plain

  python:
    name: Python (format/python, processing-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install format/python
        working-directory: format/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: "format/python: ruff, mypy --strict, pytest"
        working-directory: format/python
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy src/inkstave_format tests
          .venv/bin/python -m pytest -q
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install processing-service (depends on format/python)
        working-directory: processing-service
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ../format/python
          .venv/bin/pip install -e ".[dev]"
      - name: "processing-service: ruff, mypy --strict, pytest"
        working-directory: processing-service
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy src/inkstave_processing tests
          .venv/bin/python -m pytest -q

  cross-lang-roundtrip:
    name: Cross-language .smpk format round-trip (format/scripts/cross_lang_roundtrip.sh)
    # Self-contained (its own JDK + Android SDK + Python setup) rather than
    # depending on the kotlin/python jobs above, since GitHub Actions jobs
    # don't share a filesystem -- this needs both client/'s Gradle build and
    # format/python's venv in the same job. Verifies the one thing neither
    # the kotlin job nor the python job checks on its own: that a
    # manifest.json written by one language is read identically -- unknown
    # fields included -- by the other (docs/testing-strategy.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Accept Android SDK licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Set up format/python
        working-directory: format/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Run cross-language round-trip
        run: ./format/scripts/cross_lang_roundtrip.sh
