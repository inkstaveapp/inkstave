[versions]
# Build-wide settings, read by every module's build script.
jvmTarget = "17"
androidCompileSdk = "37"
androidTargetSdk = "37"
androidMinSdk = "26"
ktlint = "1.8.0"

# Kotlin 2.2.20 is what Compose Multiplatform 1.12.1 recommends. AGP is ahead of
# the Kotlin Multiplatform plugin's documented range because Compose
# Multiplatform's Android artifacts need AGP 9.1+ and compileSdk 37.
kotlin = "2.2.20"
agp = "9.4.0"
composeMultiplatform = "1.12.1"
# Compose Multiplatform publishes Material 3 on its own version line.
composeMaterial3 = "1.9.0"
sqldelight = "2.3.2"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
ktlintGradle = "14.2.0"
# detekt dropped for M0 -- see the comment at the top of build.gradle.kts.

androidxActivityCompose = "1.11.0"
androidxCoreKtx = "1.16.0"
# PDFBox 3.0.7 (current stable per Maven Central, verified live): desktop-only PDF
# rendering for M1 import (docs/architecture.md's PDF-import path). Not used on
# Android -- that target renders PDFs with the platform's built-in
# android.graphics.pdf.PdfRenderer instead, so this dependency never ships in the APK.
pdfbox = "3.0.7"
# CameraX 1.6.2 (current stable per developer.android.com/jetpack/androidx/releases/camera,
# verified live -- released 2026-08-26): M4's Android-only camera capture flow
# (ROADMAP.md). Android-only, like PdfRenderer above; camera-view specifically
# for PreviewView, the standard CameraX live-preview widget.
camerax = "1.6.2"
# JmDNS 3.6.1 (current stable per Maven Central, verified live): the one new
# dependency M4's LAN discovery slice genuinely needs -- there's no JDK
# -builtin mDNS/DNS-SD support, and JmDNS is pure Java (no native code), so it
# works identically on both androidMain and desktopMain (docs/sync-protocol.md).
jmdns = "3.6.1"

[libraries]
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
