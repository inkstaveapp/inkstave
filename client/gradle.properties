org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0+ ships "built-in Kotlin" support and, by default, refuses to
# coexist with the classic org.jetbrains.kotlin.android /
# org.jetbrains.kotlin.multiplatform plugins this project still uses (the
# Kotlin Multiplatform Gradle plugin's own documented AGP compatibility
# range hasn't caught up to AGP 9's new built-in-Kotlin/new-DSL model as of
# this scaffolding, September 2026). These two properties are Android's own
# documented temporary bypass (see the com.android.application plugin's
# error message / https://developer.android.com/r/tools/built-in-kotlin).
# Migrating to built-in Kotlin properly is real follow-up work, not a
# default to flip -- revisit once Kotlin Multiplatform's tooling supports
# AGP 9's new DSL without this flag.
android.builtInKotlin=false
android.newDsl=false
