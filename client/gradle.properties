org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.mpp.stability.nowarn=true

android.useAndroidX=true
android.nonTransitiveRClass=true


# shared/build.gradle.kts wires an explicit source-set hierarchy (jvmCommon, a
# manually-created intermediate source set shared by androidMain/desktopMain --
# see the comment there) rather than relying on Kotlin's default hierarchy
# template, which doesn't have a node for "every JVM-family target, including
# Android" out of the box. Disabling the template avoids KGP trying to apply
# and validate against it on top of the manual edges, which otherwise produces
# spurious "hierarchy template not applied correctly" warnings.
kotlin.mpp.applyDefaultHierarchyTemplate=false
