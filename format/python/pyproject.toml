[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inkstave-format"
version = "0.1.0"
description = "Typed Python models and JSON Schema validation for the Inkstave .smpk score format"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
# types-jsonschema: jsonschema itself ships no inline type information, so
# mypy --strict cannot check schemas.py without these stubs -- previously an
# undeclared dependency (present in one already-set-up .venv but missing from
# this list and from NOTICE.md), which meant a genuinely fresh `pip install
# -e ".[dev]"` failed mypy --strict with "Library stubs not installed for
# jsonschema". Found and fixed while setting up a single shared venv for
# format/python + processing-service (see docs/ide-setup.md).
dev = ["mypy>=1.14", "ruff>=0.8", "pytest>=8.3", "types-jsonschema>=4.23"]

[project.scripts]
# Cross-language `.smpk` format round-trip check
# (format/scripts/cross_lang_roundtrip.sh) -- not a general-purpose CLI,
# see cross_lang_cli.py's module docstring.
inkstave-format-cross-lang-cli = "inkstave_format.cross_lang_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkstave_format"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
